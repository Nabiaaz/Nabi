events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;

        # 1. Redirection VLESS WebSocket
        location /marleyn-ws {
            proxy_redirect off;
            proxy_pass https://trendmy.com.ng;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host trendmy.com.ng;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Redirection TROJAN WebSocket
        location /marleyn-tj {
            proxy_redirect off;
            proxy_pass https://trendmy.com.ng;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host trendmy.com.ng;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
