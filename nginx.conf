events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;

        # Configuration pour VLESS
        location /marleyn-ws {
            proxy_redirect off;
            proxy_pass https://trendmy.com.ng;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host trendmy.com.ng;
        }

        # Configuration pour Trojan
        location /marleyn-tj {
            proxy_redirect off;
            proxy_pass https://trendmy.com.ng;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host trendmy.com.ng;
        }
    }
}
